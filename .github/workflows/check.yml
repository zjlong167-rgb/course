name: foundation
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
