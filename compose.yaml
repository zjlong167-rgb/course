services:
  mysql:
    image: mysql:8.4.9
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-course}
      MYSQL_USER: ${MYSQL_USER:-course}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
