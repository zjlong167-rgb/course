name: ${COMPOSE_PROJECT_NAME:-course-prod}
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes: ["${DATA_ROOT:?required}/mysql:/var/lib/mysql"]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
    logging: *logging
  migrate:
    image: course-api:${RELEASE:?required}
    build: {context: .., dockerfile: backend/Dockerfile}
    command: [/app/bin/migrate]
    environment:
      MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=UTC
    depends_on:
      mysql: {condition: service_healthy}
    logging: *logging
  api:
    image: course-api:${RELEASE}
    build: {context: .., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=UTC
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:?required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes: ["${DATA_ROOT}/assets:/data/assets"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health/ready]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *logging
  web:
    image: course-web:${RELEASE}
    build: {context: .., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    ports: ["${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health/ready]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *logging
